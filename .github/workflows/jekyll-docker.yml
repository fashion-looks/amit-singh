name: Jekyll site CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site

      - name: Validate static site inputs
        shell: bash
        run: |
          set -euo pipefail
          if [ -f index.md ] || [ -f index.html ] || [ -f README.md ]; then
            echo "Site entry point found."
          else
            echo "No index.md, index.html, or README.md found; Jekyll will still build any available pages."
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Jekyll
        run: gem install jekyll --no-document

      - name: Build site
        run: jekyll build --future --destination _site
