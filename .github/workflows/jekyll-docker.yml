name: Jekyll site CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Jekyll
        run: |
          gem install jekyll bundler --no-document

      - name: Build site
        run: |
          if [ -f Gemfile ]; then
            bundle exec jekyll build --future
          else
            jekyll build --future
          fi
