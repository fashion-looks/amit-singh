name: Jekyll site CI

on:
  push:
    branches: ["main"]
    paths:
      - "*.md"
      - "*.html"
      - "_config.yml"
      - "_layouts/**"
      - "_includes/**"
      - "assets/**"
      - ".github/workflows/jekyll-docker.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "*.md"
      - "*.html"
      - "_config.yml"
      - "_layouts/**"
      - "_includes/**"
      - "assets/**"
      - ".github/workflows/jekyll-docker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install Jekyll
        run: gem install jekyll --no-document

      - name: Build static site
        run: jekyll build --future --destination _site
