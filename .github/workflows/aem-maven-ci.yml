name: AEM Maven validation

on:
  push:
    branches: [main]
    paths:
      - "aemaa-cs-starter/**"
      - ".github/workflows/aem-maven-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "aemaa-cs-starter/**"
      - ".github/workflows/aem-maven-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check starter structure
        shell: bash
        run: |
          set -euo pipefail
          test -f aemaa-cs-starter/README.md
          test -f aemaa-cs-starter/IMPLEMENTATION-NOTES.md
          test -f aemaa-cs-starter/core/src/main/java/com/fashionlooks/aemcloudstarter/core/models/PromoModel.java
          test -f aemaa-cs-starter/core/src/test/java/com/fashionlooks/aemcloudstarter/core/models/PromoModelTest.java
          test -f aemaa-cs-starter/frontend/src/api/contentGraphql.ts
          test -f aemaa-cs-starter/dispatcher/src/conf.d/available_farms/aemcloudstarter_publish_farm.any
          echo "AEM starter structure checks passed."

      - name: Verify Maven project when present
        shell: bash
        run: |
          set -euo pipefail
          pom_file="$(find aemaa-cs-starter -name pom.xml -print -quit)"
          if [ -n "$pom_file" ]; then
            echo "Found Maven project at $pom_file"
            mvn -B -ntp -f "$pom_file" verify
          else
            echo "No Maven pom.xml found. This repository currently contains AEM starter examples, not a generated Maven project."
            echo "Maven build skipped; structure validation completed."
          fi
