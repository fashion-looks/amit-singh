name: Mind Starlight Scheduled Maintenance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mind-starlight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mind-starlight/requirements.txt
      - run: pip install -r requirements.txt
      - name: Dependency consistency
        run: pip check
      - name: Compile and test health endpoint
        run: |
          python -m py_compile app.py
          python - <<'PY'
          import app
          client = app.app.test_client()
          r = client.get("/healthz")
          assert r.status_code == 200
          assert r.get_json()["status"] == "ok"
          print("Maintenance checks passed.")
          PY
