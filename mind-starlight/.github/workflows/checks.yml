name: Python checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mind-starlight/requirements.txt
      - name: Compile Python
        run: python -m py_compile mind-starlight/app.py
      - name: Flask route smoke test
        working-directory: mind-starlight
        run: |
          python - <<'PY'
          import app
          client = app.app.test_client()
          response = client.get("/")
          assert response.status_code == 200
          assert b"GALAXY VISUALIZER" in response.data
          assert b"GALAXY CONTROL" in response.data
          print("Route smoke test passed")
          PY
